x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: prediction-arb-pg
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: prediction_arb
      POSTGRES_USER: arb
      POSTGRES_PASSWORD: arb_local_dev
    shm_size: "2gb"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arb -d prediction_arb"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  event-bus:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: node services/event-bus/dist/index.js
    ports:
      - "3100:3100"
    env_file: ../.env
    environment:
      EVENT_BUS_PORT: "3100"
    logging: *default-logging
